services:

  # ---------------------------------------------------------
  # FastAPI backend (RAG API, ingestion pipeline, /ask route)
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
      args:
        INSTALL_ML: "false"
    container_name: aispire_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - CHROMA_HOST=chroma
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./app/backend:/app          # live code reload during dev
      - ./data:/app/data            # raw + translated manuals, eval sets
      - ./db:/app/db
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aispire_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: aispire_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aispire_net

  # ---------------------------------------------------------
  # Postgres — manual metadata, chunk records, query logs
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aispire_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aispire}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aispire}
      - POSTGRES_DB=${POSTGRES_DB:-aispire_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - aispire_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aispire} -d ${POSTGRES_DB:-aispire_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------
  # Chroma — vector store for manual chunk embeddings
  # ---------------------------------------------------------
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: aispire_chroma
    ports:
      - "8001:8000"   # mapped to host 8001 so it doesn't clash with backend's 8000
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - aispire_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------
  # Ollama — local LLM generation (qwen2.5:7b-instruct)
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aispire_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - aispire_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    # NOTE: pull the model after the container is up:
    # docker compose exec ollama ollama pull qwen2.5:7b-instruct

networks:
  aispire_net:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  ollama_data: